name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      # ubuntu-latest ships an Android SDK at this path; avoid the flaky setup action.
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo "(no platforms yet)"
          which sdkmanager || ls "$ANDROID_SDK_ROOT/cmdline-tools" || true

      - name: Install SDK packages (platform 36, build-tools)
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /tmp/sdk.log 2>&1 || {
            tail -30 /tmp/sdk.log; exit 1; }
          echo "--- installed platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Lower compileSdk for CI check only
        run: |
          # The project pins compileSdk 37 (Android 17 preview), which is not in the
          # public SDK channel yet. Compile against 36 so Kotlin syntax and types are
          # still verified; the real APK must be built with 37 locally.
          grep -n "compileSdk" app/build.gradle
          sed -i 's/compileSdk 37/compileSdk 36/' app/build.gradle
          grep -n "compileSdk" app/build.gradle

      - name: Compile Kotlin (syntax + types)
        run: |
          chmod +x gradlew || true
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon --console=plain 2>&1 | tail -80
