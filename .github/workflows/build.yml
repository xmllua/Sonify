name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          set -e
          SDKM=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /tmp/sdk.log 2>&1 || {
            tail -40 /tmp/sdk.log; exit 1; }
          ls "$ANDROID_SDK_ROOT/platforms"

      - name: Force compileSdk 36 and targetSdk 36
        run: |
          set -e
          echo "--- before ---"
          grep -nE "compileSdk|targetSdk|minSdk" app/build.gradle || true
          # compileSdk 37 = Android 17 preview, absent from the public SDK channel.
          # Rewrite every SDK pin so the APK can actually be assembled here.
          sed -i -E 's/compileSdk[[:space:]]+37/compileSdk 36/g' app/build.gradle
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*37/compileSdk = 36/g' app/build.gradle
          sed -i -E 's/targetSdk[[:space:]]+3[0-9]/targetSdk 36/g' app/build.gradle
          echo "--- after ---"
          grep -nE "compileSdk|targetSdk|minSdk" app/build.gradle || true
          grep -n "compileSdk" app/build.gradle | grep -q 36 || { echo "compileSdk rewrite failed"; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble debug APK
        run: |
          set -o pipefail
          chmod +x gradlew || true
          ./gradlew :app:assembleDebug --no-daemon --console=plain \
            -x lint -x lintVitalRelease -x test -x testDebugUnitTest
          echo "=== exit=$? ==="

      - name: Locate APK
        id: locate
        if: always()
        run: |
          echo "--- outputs tree ---"
          find app/build/outputs -type f -name '*.apk' -printf '%p  %s bytes\n' 2>/dev/null || true
          APK=$(find app/build/outputs -type f -name '*.apk' 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "found=$APK" >> "$GITHUB_OUTPUT"
            ls -lh "$APK"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "NO APK PRODUCED"
          fi

      - name: Upload APK
        if: steps.locate.outputs.found != ''
        uses: actions/upload-artifact@v4
        with:
          name: sonify-debug-apk
          path: ${{ steps.locate.outputs.found }}
          if-no-files-found: error
          retention-days: 7

      - name: Fail if no APK
        if: steps.locate.outputs.found == ''
        run: |
          echo "::error::No APK was produced"
          exit 1