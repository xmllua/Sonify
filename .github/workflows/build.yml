name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /tmp/sdk.log 2>&1 || {
            tail -30 /tmp/sdk.log; exit 1; }
          ls "$ANDROID_SDK_ROOT/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile against SDK 36
        run: |
          # compileSdk 37 (Android 17 preview) is not in the public SDK channel yet,
          # so the APK is assembled against 36. The real target build uses 37.
          sed -i 's/compileSdk 37/compileSdk 36/' app/build.gradle
          grep -n "compileSdk" app/build.gradle
          chmod +x gradlew || true

      - name: Assemble debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --console=plain \
            -x lint -x lintVitalRelease -x test -x testDebugUnitTest 2>&1 | tail -60

      - name: Show APK
        if: always()
        run: |
          find app/build/outputs -name '*.apk' -printf '%p  %s bytes\n' 2>/dev/null || echo "(no apk)"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonify-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7